name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Lint production Python
        run: python -m ruff check app

      - name: Type-check full application
        run: python -m mypy app

      - name: Check frontend JavaScript syntax
        run: |
          node --check app/static/js/messages.js
          node --check app/static/js/escape.js
          node --check app/static/js/app.js

      - name: Run test suite
        run: python -m pytest -q

      - name: Reliability invariants and fault injection gate
        run: >-
          python -m pytest -q
          tests/test_reliability_invariants.py
          tests/test_moving_goalpost.py
          tests/test_setup_lifecycle.py
          tests/test_decision_conflict_guards.py
          tests/test_decision_outbox.py
